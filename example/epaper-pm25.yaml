# ESP32-S3 price-tag board + Pervasive Displays 2.13" black/white/red e-paper
# Shows a PM2.5 reading from Home Assistant.
#
# A full refresh of this tri-colour panel takes ~15-20 s and flashes the screen,
# so the display only redraws when it's worth it (see the interval: block):
#  - the reading moved by more than change_pct percent, at most every min_refresh_s
#  - Home Assistant has been unreachable (or the sensor unavailable) for
#    offline_after_s: shown once, then cleared when data comes back

substitutions:
  ha_entity: sensor.pm2_5                        # the HA entity to show
  title: "PM2.5"                                # static text in the title bar
  warn_level: "35.5"        # µg/m³ at which the number turns red (EPA "unhealthy for sensitive groups")
  change_pct: "5"           # redraw when the reading moves by more than this many percent
  min_refresh_s: "300"      # ...but never more often than every 5 min
  offline_after_s: "600"    # show "no data" after 10 min without Home Assistant

esphome:
  name: epaper-pm25
  friendly_name: E-Paper PM2.5
  on_boot:
    priority: -100
    then:
      - component.update: epd   # shows "Waiting for data..." until the first reading

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

external_components:
  - source: github://ReflectiveObsidian/esphome-pervasive-epd@main
    components: [pervasive_epd]

logger:

# Keep the api:, ota: and wifi: blocks ESPHome Builder generated for your device.
api:
  encryption:
    key: "PASTE_THE_KEY_ESPHOME_BUILDER_GENERATED"

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: homeassistant
    id: ha_time

# ---------------------------------------------------------------------------
# PM2.5 from Home Assistant
# ---------------------------------------------------------------------------
sensor:
  - platform: homeassistant
    id: pm25
    entity_id: ${ha_entity}
    # Named so you can see in HA (device page, Diagnostic) whether the value arrives.
    name: "PM2.5 received"
    entity_category: diagnostic
    unit_of_measurement: "µg/m³"
    accuracy_decimals: 1
    on_value:
      - logger.log:
          level: INFO
          format: "PM2.5 from Home Assistant: %.1f"
          args: [x]
      # First reading after boot: draw it now instead of waiting for the interval.
      - if:
          condition:
            lambda: return std::isnan(id(shown_pm)) && !std::isnan(x);
          then:
            - script.execute: draw_now

script:
  # Redraw with whatever is current: the live reading, or the "no data" state.
  - id: draw_now
    mode: single
    then:
      - lambda: |-
          // HA connected (state subscription, not just a log viewer) and the value is a number
          const bool ok = esphome::api::global_api_server->is_connected_with_state_subscription() &&
                          id(pm25).has_state() && !std::isnan(id(pm25).state);
          id(shown_offline) = !ok;
          if (ok) id(shown_pm) = id(pm25).state;
          id(last_draw_ms) = millis();
      - component.update: epd   # if a refresh is running, the driver queues this one

globals:
  - id: shown_pm            # value currently on the screen (NAN = nothing yet)
    type: float
    initial_value: "NAN"
  - id: last_draw_ms        # when the screen was last redrawn
    type: uint32_t
    initial_value: "0"
  - id: shown_offline       # screen currently shows the "no data" note
    type: bool
    initial_value: "false"
  - id: offline_since_ms    # when data stopped arriving (0 = data OK)
    type: uint32_t
    initial_value: "0"

# Every 15 s: track whether data is arriving, and decide whether to redraw.
interval:
  - interval: 15s
    then:
      - if:
          condition:
            lambda: |-
              const uint32_t now = millis();
              const bool ok = esphome::api::global_api_server->is_connected_with_state_subscription() &&
                              id(pm25).has_state() && !std::isnan(id(pm25).state);
              if (ok) {
                id(offline_since_ms) = 0;
              } else if (id(offline_since_ms) == 0) {
                id(offline_since_ms) = now ? now : 1;
              }
              if (id(epd).is_updating()) return false;

              // No data: show it once, after offline_after_s.
              if (!ok)
                return !id(shown_offline) && (now - id(offline_since_ms)) / 1000 >= ${offline_after_s};

              const float v = id(pm25).state;
              const float shown = id(shown_pm);
              if (std::isnan(shown)) return true;                            // first reading
              if ((now - id(last_draw_ms)) / 1000 < ${min_refresh_s}) return false;  // at most every 5 min
              if (id(shown_offline)) return true;                            // data is back: clear the note
              // Moved by more than change_pct, and the number on screen would actually change.
              return fabsf(v - shown) > fabsf(shown) * ${change_pct} / 100.0f &&
                     lroundf(v) != lroundf(shown);
          then:
            - script.execute: draw_now

# ---------------------------------------------------------------------------
# Fonts (downloaded from Google Fonts at compile time)
# Listing glyphs: replaces ESPHome's default character set, so each font
# names exactly what it needs.
# ---------------------------------------------------------------------------
font:
  - file:
      type: gfonts
      family: Roboto
      weight: bold
    id: font_big
    size: 50
    glyphs: ["0123456789.-"]          # big font only ever shows the number
  - file:
      type: gfonts
      family: Roboto
      weight: bold
    id: font_small
    size: 16
    glyphsets: [GF_Latin_Kernel]      # letters, digits, punctuation
    glyphs: ["µ³"]                    # plus the unit symbols

# ---------------------------------------------------------------------------
# Display
# ---------------------------------------------------------------------------
spi:
  clk_pin: GPIO12    # header SCLK
  mosi_pin: GPIO11   # header SDI

display:
  - platform: pervasive_epd
    id: epd
    model: 2.13in
    cs_pin: GPIO10      # header CS
    dc_pin: GPIO13      # header D/C
    reset_pin: GPIO14   # header RST
    busy_pin: GPIO15    # header BUSY
    rotation: 90        # landscape 212 x 104. Use 270 if upside down.
    update_interval: never   # refreshed by on_boot and the interval above
    lambda: |-
      const auto RED = Color(255, 0, 0);
      const int W = it.get_width(), H = it.get_height();
      it.fill(Color::WHITE);

      // --- title bar: label left, time of this refresh right ---
      it.filled_rectangle(0, 0, W, 22, Color::BLACK);
      it.print(5, 11, id(font_small), Color::WHITE, TextAlign::CENTER_LEFT, "${title}");
      auto now = id(ha_time).now();
      if (now.is_valid())
        it.strftime(W - 5, 11, id(font_small), Color::WHITE, TextAlign::CENTER_RIGHT, "%H:%M", now);

      const float v = id(shown_pm);
      const bool offline = id(shown_offline);
      if (std::isnan(v)) {
        it.print(W / 2, 52, id(font_small), offline ? RED : Color::BLACK, TextAlign::CENTER,
                 offline ? "No data from HA" : "Waiting for data...");
        return;
      }

      // --- reading: number + unit, red from warn_level up ---
      const Color ink = v >= ${warn_level} ? RED : Color::BLACK;
      it.printf(132, 74, id(font_big), ink, TextAlign::BASELINE_RIGHT, "%.0f", v);
      it.print(137, 74, id(font_small), Color::BLACK, TextAlign::BASELINE_LEFT, "µg/m³");

      it.horizontal_line(0, H - 22, W, Color::BLACK);
      if (offline) {
        // --- last value is stale: say since when ---
        const uint32_t lost_s = id(offline_since_ms) ? (millis() - id(offline_since_ms)) / 1000 : 0;
        if (now.is_valid() && id(offline_since_ms)) {
          const auto since = ESPTime::from_epoch_local(now.timestamp - lost_s);
          it.strftime(5, H - 11, id(font_small), RED, TextAlign::CENTER_LEFT, "No data since %H:%M", since);
        } else {
          it.print(5, H - 11, id(font_small), RED, TextAlign::CENTER_LEFT, "No data from HA");
        }
      } else {
        // --- EPA category along the bottom ---
        static const char *const NAMES[] = {"Good", "Moderate", "Unhealthy (sensitive)",
                                            "Unhealthy", "Very unhealthy", "Hazardous"};
        const int cat = v <= 9.0f ? 0 : v <= 35.4f ? 1 : v <= 55.4f ? 2 : v <= 125.4f ? 3 : v <= 225.4f ? 4 : 5;
        it.print(5, H - 11, id(font_small), ink, TextAlign::CENTER_LEFT, NAMES[cat]);
      }

# ---------------------------------------------------------------------------
# Experiment: refresh speed vs. panel temperature setting (see chat)
# Both appear under the device's Configuration section in Home Assistant.
# ---------------------------------------------------------------------------
number:
  - platform: template
    name: "Panel temperature"
    id: panel_temp
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 40
    step: 1
    initial_value: 25
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(epd).set_temperature((uint8_t) x);

button:
  - platform: template
    name: "Refresh display"
    entity_category: config
    on_press:
      - script.execute: draw_now
